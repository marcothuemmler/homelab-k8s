- name: Join worker to cluster
  block:
    - name: Copy kubeadm join command to worker
      ansible.builtin.copy:
        content: "{{ hostvars[groups['k8s_master'][0]]['join_command'].stdout }}"
        dest: /tmp/kube_join_cmd.sh
        owner: root
        group: root
        mode: "0700"
    - name: Run kubeadm join
      ansible.builtin.command: sh /tmp/kube_join_cmd.sh
      args:
        creates: /etc/kubernetes/kubelet.conf
  always:
    - name: Remove join command script
      ansible.builtin.file:
        path: /tmp/kube_join_cmd.sh
        state: absent
