- name: Unhold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: install

- name: Add Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ k8s_repo_url }} /"
    state: present
    filename: kubernetes

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Upgrade kubeadm
  ansible.builtin.apt:
    name: "kubeadm={{ k8s_version }}.*"
    state: present

- name: Hold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold

- name: Drain control plane node
  ansible.builtin.command: kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --force
  become: true
  become_user: "{{ ansible_user }}"
  when: groups['k8s_master'] | length > 1

- name: Apply upgrade
  ansible.builtin.command: kubeadm upgrade apply stable-{{ k8s_version }} -y

- name: Unhold kubelet and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubelet
    - kubectl

- name: Upgrade kubelet and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}.*"
      - "kubectl={{ k8s_version }}.*"
    state: present

- name: Hold kubelet and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubectl

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true

- name: Wait for Kubernetes API server to become available
  ansible.builtin.command: kubectl get nodes
  become: true
  become_user: "{{ ansible_user }}"
  register: kubectl_check
  retries: 30
  delay: 10
  until: kubectl_check.rc == 0

- name: Check if node is cordoned
  ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o jsonpath='{.spec.unschedulable}'
  become: true
  become_user: "{{ ansible_user }}"
  register: node_cordoned
  failed_when: false

- name: Uncordon control plane node
  ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
  become: true
  become_user: "{{ ansible_user }}"
  when: node_cordoned.stdout == "true"
