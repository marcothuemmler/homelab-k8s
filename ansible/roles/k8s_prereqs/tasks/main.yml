- name: Ensure apt packages for Kubernetes repo
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: yes

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Kubernetes APT key and save as GPG keyring
  become: true
  shell: |
    curl -fsSL {{ k8s_repo_url }}Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes APT repository
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ k8s_repo_url }} /"
    owner: root
    group: root
    mode: "0644"

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install kubeadm, kubelet, kubectl
  apt:
    name: "{{ k8s_packages }}"
    state: present

- name: Hold Kubernetes packages
  command: apt-mark hold kubelet kubeadm kubectl
  changed_when: false

- name: Enable kubelet service
  systemd:
    name: kubelet
    enabled: yes
    state: started