- name: Unhold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: install

- name: Add Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] {{ k8s_repo_url }} /"
    state: present
    filename: kubernetes

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Upgrade kubeadm
  ansible.builtin.apt:
    name: "kubeadm={{ k8s_version }}.*"
    state: present

- name: Hold kubeadm
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold

- name: Drain worker node
  ansible.builtin.command: kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --force
  delegate_to: "{{ groups['k8s_master'][0] }}"
  become: true
  become_user: "{{ ansible_user }}"

- name: Upgrade node
  ansible.builtin.command: kubeadm upgrade node

- name: Unhold kubelet and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubelet
    - kubectl

- name: Upgrade kubelet and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}.*"
      - "kubectl={{ k8s_version }}.*"
    state: present

- name: Hold kubelet and kubectl
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubectl

- name: Restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true

- name: Uncordon worker node
  ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
  delegate_to: "{{ groups['k8s_master'][0] }}"
  become: true
  become_user: "{{ ansible_user }}"
